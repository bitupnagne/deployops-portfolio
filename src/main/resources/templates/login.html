<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="_csrf" th:content="${_csrf.token}">
  <meta name="_csrf_header" th:content="${_csrf.headerName}">
  <title>로그인 | DeployOps</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/img/assistant-mark.svg}">
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>

<div id="login-page">
  <div class="login-left">
    <img th:src="@{/img/suite-logo.svg}" alt="Office Suite" class="login-logo">
    <p class="login-tagline">배포 관리 시스템으로 안전하고 체계적인 배포를 지원합니다.</p>
    <div class="login-assistant-wrap">
      <img th:src="@{/img/assistant-mark.svg}" alt="Assistant" class="login-assistant">
      <div class="login-bubble">안녕하세요. 배포 관리를 빠르게 시작해볼게요.</div>
    </div>
  </div>
  <div class="login-right">
    <div class="login-card">
      <h2 class="login-card-title">로그인</h2>
      <p class="login-card-sub" th:text="${publicDemo} ? '설치 없이 배포 관리 화면을 살펴보세요.' : 'Office Suite 계정으로 로그인해 주세요.'">Office Suite 계정으로 로그인해 주세요.</p>

      <div th:if="${publicDemo}" class="notice-box info" style="display:block;margin-bottom:16px">
        <strong>포트폴리오 공개 데모</strong><br>
        <span th:text="${publicDemoMessage}"></span>
        <form method="post" th:action="@{/login}" style="margin-top:12px">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
          <input type="hidden" name="username" th:value="${publicDemoLoginId}">
          <input type="hidden" name="password" th:value="${publicDemoPassword}">
          <button type="submit" class="login-btn">샘플 콘솔 둘러보기</button>
        </form>
      </div>

      <div th:if="${param.error}" class="notice-box danger" style="margin-bottom:16px">
        아이디 또는 비밀번호가 올바르지 않습니다.
      </div>
      <div th:if="${param.locked}" class="notice-box danger" style="margin-bottom:16px">
        로그인 실패가 많아 계정이 일시 잠겼습니다. 약 10분 후 다시 시도해 주세요.
      </div>
      <div th:if="${param.logout}" class="notice-box info" style="margin-bottom:16px">
        로그아웃되었습니다.
      </div>
      <div th:if="${param.ssoError}" class="notice-box danger" role="alert" style="margin-bottom:16px">
        SSO 링크가 만료되었거나 이미 사용되었습니다. 오피스에서 배포 시스템을 다시 열어 주세요.
      </div>
      <div th:if="${param.expired}" class="notice-box info" style="margin-bottom:16px">
        로그인 세션이 만료되었습니다. 다시 로그인해 주세요.
      </div>

      <form th:unless="${publicDemo}" method="post" th:action="@{/login}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div class="login-field">
          <label class="login-label" for="login-username">아이디</label>
          <input id="login-username" name="username" type="text" class="login-input" placeholder="아이디를 입력해 주세요" autocomplete="username" required>
        </div>
        <div class="login-field">
          <label class="login-label" for="login-password">비밀번호</label>
          <input id="login-password" name="password" type="password" class="login-input" placeholder="비밀번호를 입력해 주세요" autocomplete="current-password" required>
        </div>

        <button type="submit" class="login-btn">로그인</button>
      </form>
    </div>
  </div>
</div>

<th:block th:unless="${publicDemo}">
<th:block th:if="${param.otp}">
  <p id="otp-load-status" role="status">2차 인증을 불러오는 중입니다.</p>
  <form id="otp-cancel" method="post" th:action="@{/logout}">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <button class="btn btn-ghost" type="submit">로그인 취소</button>
  </form>
  <script th:src="@{/otp-ui/system-otp.js}"></script>
  <script th:src="@{/js/deploy-otp.js}" data-flow="login"></script>
</th:block>
</th:block>
<script th:src="@{/js/deploy-loading.js}"></script>
</body>
</html>
