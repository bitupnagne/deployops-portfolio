<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="_csrf" th:content="${_csrf.token}">
  <meta name="_csrf_header" th:content="${_csrf.headerName}">
  <title>2차 인증 등록 | DeployOps</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/img/assistant-mark.svg}">
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<div id="login-page">
  <div class="login-left">
    <img th:src="@{/img/suite-logo.svg}" alt="portfolio" class="login-logo">
    <p class="login-tagline">관리자 계정 보호를 위한 2차 인증(OTP)을 등록합니다.</p>
  </div>
  <div class="login-right">
    <div class="login-card" style="max-width:440px">
      <h2 class="login-card-title">2차 인증(OTP) 등록</h2>

      <!-- 이미 등록된 경우 -->
      <div th:if="${already}">
        <div class="notice-box info" style="margin-bottom:16px">이미 2차 인증이 등록되어 있습니다.</div>
        <form method="post" th:action="@{/otp/disable}">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
          <button class="btn btn-ghost" type="submit" style="width:100%;color:var(--danger)">2차 인증 해제</button>
        </form>
        <a th:href="@{/deploy/dashboard}" class="btn btn-primary" style="width:100%;margin-top:10px;display:block;text-align:center">대시보드로</a>
      </div>

      <div th:unless="${already}">
        <p id="otp-load-status" role="status">2차 인증 등록을 불러오는 중입니다.</p>
        <a th:href="@{/deploy/dashboard}">대시보드로</a>
      </div>
    </div>
  </div>
</div>
<th:block th:unless="${already}">
  <script th:src="@{/otp-ui/system-otp.js}"></script>
  <script th:src="@{/js/deploy-otp.js}" data-flow="setup"></script>
</th:block>
<script th:src="@{/js/deploy-loading.js}"></script>
</body>
</html>
