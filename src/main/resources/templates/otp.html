<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="_csrf" th:content="${_csrf.token}"/>
  <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
  <title>2차 인증 | DeployOps</title>
  <link rel="icon" type="image/svg+xml" th:href="@{/img/assistant-mark.svg}">
  <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
  <p id="otp-load-status" role="status">2차 인증을 불러오는 중입니다.</p>
  <form id="otp-cancel" method="post" th:action="@{/logout}">
    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
    <button class="btn btn-ghost" type="submit">로그아웃</button>
  </form>
  <script th:src="@{/otp-ui/system-otp.js}"></script>
  <script th:src="@{/js/deploy-otp.js}" data-flow="verify"></script>
<script th:src="@{/js/deploy-loading.js}"></script>
</body>
</html>
