<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"><body>
<th:block th:fragment="content">
  <div class="page-header"><div><h1 class="page-title">인프라 운영</h1><p class="page-desc">등록된 에이전트로 GitLab·Runner·Nexus 서버의 상태와 로그를 확인합니다.</p></div></div>
  <section class="section-card infra-operations">
    <div class="infra-selection-grid">
    <div class="form-group">
    <label class="form-label" for="infra-server">대상 서버</label>
    <select id="infra-server" class="form-select"></select>
    </div>
    <div class="form-group">
    <label class="form-label" for="infra-service">서비스</label>
    <select id="infra-service" class="form-select"><option value="gitlab">GitLab</option><option value="runner">Runner</option><option value="nexus">Nexus</option></select>
    </div>
    </div>
    <div class="infra-action-row">
      <button type="button" class="btn btn-ghost" data-infra-action="status">상태 확인</button>
      <button type="button" class="btn btn-ghost" data-infra-action="logs">최근 로그 200줄</button>
      <button type="button" class="btn btn-ghost" data-infra-action="start">시작</button>
      <button type="button" class="btn btn-ghost" data-infra-action="stop">정지</button>
      <button type="button" class="btn btn-ghost" data-infra-action="restart">재시작</button>
      <button type="button" class="btn btn-primary" data-infra-action="backup">GitLab 백업</button>
    </div>
    <div class="infra-operation-group">
    <label class="form-label" for="infra-backup-id">복구할 GitLab 백업 ID</label>
    <input id="infra-backup-id" class="form-input" maxlength="32" placeholder="백업 완료 결과의 32자리 ID">
    <p class="form-hint">복구는 같은 서버의 별도 컨테이너와 내부 전용 네트워크에 수행합니다. 설치 시 별도 복구 HTTP 포트를 지정해야 합니다.</p>
    <button type="button" class="btn btn-ghost" data-infra-action="restore">GitLab 격리 복구</button>
    </div>
    <div class="infra-operation-group">
    <p class="form-hint">Nexus 백업·복구 실행 서버를 연결한 뒤 Nexus 승인 화면에서 작업하세요. 기존 백업 이력이 생기면 실행 호스트 변경이 제한됩니다.</p>
    <button type="button" class="btn btn-ghost" id="infra-nexus-bind" th:if="${currentUser != null and currentUser.role == 'SUPER_ADMIN'}">선택 서버를 Nexus 실행 호스트로 연결</button>
    <p id="infra-message" role="status" aria-live="polite"></p>
    </div>
    <div class="infra-operation-group">
    <button type="button" class="btn btn-ghost" id="infra-history-refresh">작업 이력 새로고침</button>
    <div id="infra-history" aria-label="최근 인프라 작업"></div>
    <pre id="infra-result" style="max-height:480px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere"></pre>
    </div>
  </section>
  <script th:src="@{/js/infrastructure.js}"></script>
</th:block>
</body></html>
